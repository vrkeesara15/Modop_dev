# Local stack: docker compose up  ->  http://localhost:8000
# Optional S3-compatible storage: docker compose --profile s3 up  (and set STORAGE_BACKEND=s3 for app)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rah
      POSTGRES_PASSWORD: rah
      POSTGRES_DB: rah
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rah -d rah"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rah:rah@db:5432/rah}
      SEED_DEMO: ${SEED_DEMO:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data
      IMPORT_WATCH_DIR: /data/watch
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
      S3_BUCKET: ${S3_BUCKET:-rah}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  appdata:
  miniodata:
